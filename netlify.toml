# Netlify — Popote (export statique Next.js)
# Le site est un export statique : on publie simplement le dossier `out/`
# et on DÉSACTIVE le runtime Next.js de Netlify (sinon il gère mal l'export
# et renvoie un 404 à la racine).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
